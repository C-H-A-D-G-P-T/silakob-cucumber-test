name: Playwright Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            api:
                image: rvancea/qa-practice-api:latest
                ports:
                    - 8887:8081
                options: >-
                    --health-cmd "curl -f http://localhost:8887/api/v1/employees/1 || exit 1"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Remove fsevents from dependencies
              run: |
                  # Remove fsevents from package.json if it's there
                  if grep -q fsevents package.json; then
                    sed -i '/fsevents/d' package.json
                  fi
                  # Remove from package-lock.json
                  if [ -f package-lock.json ]; then
                    sed -i '/fsevents/d' package-lock.json
                  fi

            - name: Install dependencies (force)
              run: npm install --no-optional --force
              # This will install everything except fsevents

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Wait for API to be ready
              run: |
                  echo "Waiting for API to be ready..."
                  for i in {1..30}; do
                    if curl -f http://localhost:8887/api/v1/employees/1; then
                      echo "✅ API is ready!"
                      break
                    fi
                    echo "Attempt $i: API not ready yet..."
                    sleep 2
                  done

            - name: Run tests
              run: npm run test:all:html
              env:
                  CI: true

            - name: Upload report UI
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ui-report
                  path: reports/ui-report/ui-report.html
                  retention-days: 30

            - name: Upload report API
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: api-report
                  path: reports/api-report/api-report.html
                  retention-days: 30
