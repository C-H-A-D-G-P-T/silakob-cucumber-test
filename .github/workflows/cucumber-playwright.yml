name: Playwright Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Remove fsevents from dependencies
              run: |
                  # Remove fsevents from package.json if it's there
                  if grep -q fsevents package.json; then
                    sed -i '/fsevents/d' package.json
                  fi
                  # Remove from package-lock.json
                  if [ -f package-lock.json ]; then
                    sed -i '/fsevents/d' package-lock.json
                  fi

            - name: Install dependencies (force)
              run: npm install --no-optional --force
              # This will install everything except fsevents

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run tests
              run: npm run test:all:html
              env:
                  CI: true

            - name: Upload report UI
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ui-report
                  path: reports/ui-report
                  retention-days: 30

            - name: Upload report API
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: api-report
                  path: reports/api-report
                  retention-days: 30
